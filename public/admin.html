<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>审核台 · 算法雷达站</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">🛡️</span>
      <div>
        <h1>审核台</h1>
        <p class="sub">算法雷达站 · 游客提交审核</p>
      </div>
    </div>
    <div class="topbar-actions">
      <span class="who" id="who"><span class="dot"></span><span id="who-text">未登录</span></span>
      <a class="btn" href="/">← 返回主页</a>
      <button id="btn-setup" class="btn" hidden>初始化管理员</button>
      <button id="btn-logout" class="btn ghost" hidden>退出</button>
      <button id="btn-theme" class="icon-btn theme-toggle" title="切换明暗主题" aria-label="切换明暗主题">
        <span class="i-light" aria-hidden="true">🌙</span>
        <span class="i-dark" aria-hidden="true">☀️</span>
      </button>
    </div>
  </div>
</header>

<main class="layout">
  <!-- 未登录门禁 -->
  <section class="card gate" id="login-gate" hidden>
    <span class="brand-mark" aria-hidden="true">🔐</span>
    <h2>管理员登录</h2>
    <p class="modal-desc">审核台需要管理员权限。校验在服务端完成，连续失败会被临时限流。</p>
    <form id="login-form" class="setup-form">
      <label class="field"><span class="label">用户名</span>
        <input id="login-user" autocomplete="username" placeholder="管理员用户名">
      </label>
      <label class="field"><span class="label">口令</span>
        <input type="password" id="login-pass" autocomplete="current-password" placeholder="管理员口令">
      </label>
      <div class="modal-actions">
        <button type="submit" class="btn primary block">登录</button>
      </div>
    </form>
    <p class="callout" id="gate-note" hidden>尚未设置管理员账号。请在服务器本机打开主页点「初始化管理员」，或运行 <code>python server.py --set-password</code>。</p>
  </section>

  <!-- 审核工作区 -->
  <div id="work-area" hidden>
    <section class="stats">
      <div class="stat tone-orange"><b id="stat-pending">0</b><span>待审核</span></div>
      <div class="stat"><b id="stat-today">0</b><span>今日提交</span></div>
      <div class="stat tone-purple"><b id="stat-guest">0</b><span>游客提交总数</span></div>
      <div class="stat tone-green"><b id="stat-approved">0</b><span>已通过</span></div>
    </section>

    <section class="card">
      <div class="card-head">
        <div>
          <h2>待审核提交</h2>
          <p class="head-sub">通过后立即计入统计；拒绝会删除该条记录</p>
        </div>
        <div class="batch-bar">
          <button type="button" id="btn-refresh" class="btn small ghost">刷新</button>
          <button type="button" id="btn-approve-all" class="btn small">全部通过</button>
          <button type="button" id="btn-reject-all" class="btn small danger">全部拒绝</button>
        </div>
      </div>
      <div class="filters">
        <input id="f-keyword" type="search" placeholder="搜索模型 / 题号 / 题目 / 备注…" aria-label="关键字搜索">
        <select id="f-series" aria-label="按 AI 组合筛选"><option value="">全部 AI 组合</option></select>
      </div>
      <div class="table-scroll" id="pending-wrap"></div>
    </section>
  </div>
</main>

<div id="toast" class="toast" hidden></div>
<script src="/common.js"></script>
<script src="/admin.js"></script>
</body>
</html>
