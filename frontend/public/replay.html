<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>农场对抗赛 · 回放播放器</title>
<link rel="stylesheet" href="/replay.css">
</head>
<body>
<div id="wrap">
  <header id="top">
    <h1>农场对抗赛 · 回放</h1>
    <span class="tag" id="tSeed">seed –</span>
    <span class="tag" id="tStep">step –</span>
    <span id="tPlayers"></span>
    <span class="tag" id="tWinner">–</span>
    <span class="tag" id="tEngine">–</span>
    <button id="openFile" type="button">打开回放</button>
    <select id="theme" aria-label="主题"><option value="light">亮色</option><option value="dark">暗色</option><option value="system">跟随系统</option></select>
  </header>

  <div id="drop">
    把回放 JSON 拖到这里，或
    <label style="cursor:pointer;text-decoration:underline">
      选择文件<input id="file" type="file" accept=".json,application/json" hidden>
    </label>
    <div id="loadbox" role="status"></div>
    <div id="err"></div>
  </div>

  <main id="main" hidden>
    <section>
      <div class="boards">
        <div class="card" id="cardA">
          <h2><span class="nm nmA" id="nameA">A</span><span class="money" id="moneyA">–</span></h2>
          <div class="board" id="boardA"></div>
          <div class="legend" id="legA"></div>
        </div>
        <div class="card" id="cardB">
          <h2><span class="nm nmB" id="nameB">B</span><span class="money" id="moneyB">–</span></h2>
          <div class="board" id="boardB"></div>
          <div class="legend" id="legB"></div>
        </div>
      </div>
    </section>
    <aside>
      <div class="card">
        <h2>现金曲线</h2>
        <canvas id="cvMoney" width="720" height="260"></canvas>
      </div>
      <div class="card" style="margin-top:12px">
        <h2>市场（当前价 / 库存）</h2>
        <table class="mkt" id="mkt"></table>
      </div>
      <div class="card" style="margin-top:12px">
        <h2>本步动作</h2>
        <div id="acts"></div>
      </div>
    </aside>
  </main>

  <div id="controls" hidden>
    <div class="row" style="margin-bottom:6px">
      <button id="play" title="播放" aria-label="播放">▶</button>
      <select id="spd" aria-label="播放速度"><option value="1">1×</option><option value="4">4×</option><option value="16">16×</option><option value="64">64×</option></select>
      <button id="b1" title="上一帧" aria-label="上一帧">←</button>
      <button id="f1" title="下一帧" aria-label="下一帧">→</button>
      <button id="bd" title="前一天" aria-label="前一天">↤</button>
      <button id="fd" title="后一天" aria-label="后一天">↦</button>
      <button id="end" title="跳到结束" aria-label="跳到结束">⇥</button>
      <span class="hint" id="clock">–</span>
    </div>
    <div class="row">
      <input id="seek" aria-label="回放进度" type="range" min="0" max="0" value="0" step="1">
    </div>
  </div>
</div>

<script src="/replay.js"></script>
</body>
</html>
